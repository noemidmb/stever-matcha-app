{% extends "layout.html" %}
{% block body %}
<h1>Order for {{ popup["location"] }}</h1>
<p class="muted">{{ popup["date"] }} &middot; {{ popup["time"] }}</p>

<div class="order-layout">
  <section>
    {% for item in items %}
    <div class="card drink" data-id="{{ item['id'] }}" data-name="{{ item['name'] }}" data-price="{{ item['price_cents'] }}">
      <h2>{{ item["name"] }} <span class="price live-price"></span></h2>
      <p class="muted">{{ item["description"] }}</p>
      <div class="opts">
        <label>Temp
          <select name="temp">
            {% for name in options["temp"] %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
          </select>
        </label>
        <label>Milk
          <select name="milk">
            {% for name, cents in options["milk"].items() %}
            <option value="{{ name }}">{{ name }}{% if cents %} (+${{ "%.2f"|format(cents / 100) }}){% endif %}</option>
            {% endfor %}
          </select>
        </label>
        <label>Sweetness
          <select name="sweetness">
            {% for name in options["sweetness"] %}
            <option value="{{ name }}" {% if name == "Regular" %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <button class="btn add" type="button">Add to cart</button>
    </div>
    {% endfor %}
  </section>

    <aside class="card cart">
    <h2>Your cart</h2>
    <div id="cart-lines"></div>
    <p class="cart-total">Total <strong id="cart-total">$0.00</strong></p>
    <input id="customer-name" type="text" placeholder="Name for the order" maxlength="50">
    <button id="place-order" class="btn" type="button" disabled>Place order</button>
    <p class="muted">Pay in person at the pop-up.</p>
    <p id="order-error" class="error"></p>
  </aside>
</div>

<script>
  window.MILK_PRICES = {{ options["milk"]|tojson }};
  window.POPUP_ID = {{ popup["id"] }};
</script>
<script src="{{ url_for('static', filename='order.js') }}"></script>
{% endblock %}
